server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Static assets with cache. Vite content-hashes these filenames, so a
    # changed file gets a new name and this can safely be immutable for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — serve index.html for all non-file routes.
    #
    # index.html MUST revalidate. With no explicit Cache-Control, browsers apply
    # heuristic freshness (10% of the time since Last-Modified) and will reuse a
    # stale index.html for hours. That stale copy points at an older
    # content-hashed bundle still sitting in the browser cache, so a deploy
    # silently does not take effect — which is exactly how the portfolio kept
    # rendering in USD after the EUR switch on 1 Nov 2026.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
